name: v0.5 rclone pin verification

on:
  push:
    branches: [dev/v0.5-google-drive]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download pinned official archive
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output rclone.zip \
            https://downloads.rclone.org/v1.74.4/rclone-v1.74.4-windows-amd64.zip
      - name: Verify archive and executable hashes
        run: |
          set -euo pipefail
          echo 'ef097ef9de37a57feb7d9f9c7afb34148ad3c65be8025f1d8f7f521554a701ea  rclone.zip' | sha256sum --check --strict
          unzip -q rclone.zip
          test -f rclone-v1.74.4-windows-amd64/rclone.exe
          echo -n 'RCLONE_EXE_SHA256='
          sha256sum rclone-v1.74.4-windows-amd64/rclone.exe | awk '{print $1}'
