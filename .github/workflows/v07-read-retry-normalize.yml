name: v0.7 safe read retry normalize

on:
  push:
    branches: [dev/v0.7-hardening]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/v0.7-hardening
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
      - name: Route only PCS GET reads through bounded retry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          changed = 0
          for name in ['internal/baidu/staging_api.go', 'internal/baidu/cleanup_api.go']:
              p = Path(name)
              s = p.read_text()
              n = s.replace('c.doPCS(ctx, http.MethodGet', 'c.doPCSRead(ctx, http.MethodGet')
              if n == s:
                  raise SystemExit(f'expected safe PCS GET call not found in {name}')
              p.write_text(n)
              changed += 1
          print('patched files:', changed)
          PY
      - name: Normalize and validate hardening layer
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go mod tidy
          go test ./... -count=1
          go vet ./...
      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum cmd internal
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'fix(v0.7): retry only safe Baidu read operations'
          git push origin HEAD:dev/v0.7-hardening
