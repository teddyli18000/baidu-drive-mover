name: v0.6 cleanup completion hardening

on:
  push:
    branches: [dev/v0.6-full-pipeline]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/v0.6-full-pipeline
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
      - name: Harden cleanup completion transaction
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/v06_harden.py
          python /tmp/v06_harden.py
      - name: Normalize and validate all v0.6 sources
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go mod tidy
          go test ./... -count=1
          go vet ./...
      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum cmd internal
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'fix(v0.6): harden cleanup completion transaction'
          git push origin HEAD:dev/v0.6-full-pipeline
