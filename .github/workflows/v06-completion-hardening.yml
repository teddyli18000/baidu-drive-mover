name: v0.6 cleanup completion hardening

on:
  push:
    branches: [dev/v0.6-full-pipeline]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/v0.6-full-pipeline
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
      - name: Harden cleanup completion transaction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('internal/state/cleanup_store.go')
          s = p.read_text()
          old = '''\tvar incomplete int
\tif err := tx.QueryRowContext(ctx, `
SELECT COUNT(*) FROM owned_objects o
WHERE o.task_id = ? AND (
    (o.scope = ? AND o.object_id = ?) OR
    (o.scope = ? AND o.object_id IN (
        SELECT file_id FROM batch_files WHERE task_id = ? AND batch_id = ?
    ))
) AND (o.cleanup_allowed != 1 OR o.cleaned_at = '')`,
\t\ttaskID, ownedScopeBaiduBatchDir, batchID, ownedScopeLocalCacheFile, taskID, batchID).Scan(&incomplete); err != nil {
\t\treturn fmt.Errorf("count incomplete cleanup objects: %w", err)
\t}
\tif incomplete != 0 {
\t\treturn fmt.Errorf("batch %q still has %d cleanup objects not reconciled", batchID, incomplete)
\t}
'''
          new = '''\tvar fileCount int
\tif err := tx.QueryRowContext(ctx, `
SELECT COUNT(*) FROM batch_files WHERE task_id = ? AND batch_id = ?`, taskID, batchID).Scan(&fileCount); err != nil {
\t\treturn fmt.Errorf("count cleanup batch files: %w", err)
\t}
\tif fileCount == 0 {
\t\treturn fmt.Errorf("batch %q has no registered files", batchID)
\t}
\tvar localCount int
\tif err := tx.QueryRowContext(ctx, `
SELECT COUNT(*) FROM owned_objects o
WHERE o.task_id = ? AND o.scope = ?
  AND o.object_id IN (
    SELECT file_id FROM batch_files WHERE task_id = ? AND batch_id = ?
  )`, taskID, ownedScopeLocalCacheFile, taskID, batchID).Scan(&localCount); err != nil {
\t\treturn fmt.Errorf("count local cleanup provenance: %w", err)
\t}
\tif localCount != fileCount {
\t\treturn fmt.Errorf("batch %q has %d local provenance rows for %d files", batchID, localCount, fileCount)
\t}
\tvar baiduCount int
\tif err := tx.QueryRowContext(ctx, `
SELECT COUNT(*) FROM owned_objects
WHERE task_id = ? AND scope = ? AND object_id = ?`, taskID, ownedScopeBaiduBatchDir, batchID).Scan(&baiduCount); err != nil {
\t\treturn fmt.Errorf("count Baidu batch cleanup provenance: %w", err)
\t}
\tif baiduCount != 1 {
\t\treturn fmt.Errorf("batch %q has %d Baidu provenance rows", batchID, baiduCount)
\t}
\tvar incomplete int
\tif err := tx.QueryRowContext(ctx, `
SELECT COUNT(*) FROM owned_objects o
WHERE o.task_id = ? AND (
    (o.scope = ? AND o.object_id = ?) OR
    (o.scope = ? AND o.object_id IN (
        SELECT file_id FROM batch_files WHERE task_id = ? AND batch_id = ?
    ))
) AND (o.cleanup_allowed != 1 OR o.cleaned_at = '')`,
\t\ttaskID, ownedScopeBaiduBatchDir, batchID, ownedScopeLocalCacheFile, taskID, batchID).Scan(&incomplete); err != nil {
\t\treturn fmt.Errorf("count incomplete cleanup objects: %w", err)
\t}
\tif incomplete != 0 {
\t\treturn fmt.Errorf("batch %q still has %d cleanup objects not reconciled", batchID, incomplete)
\t}
'''
          if old not in s:
              raise SystemExit('cleanup completion block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Normalize and validate all v0.6 sources
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w ./cmd ./internal
          go mod tidy
          go test ./... -count=1
          go vet ./...
      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum cmd internal
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'fix(v0.6): harden cleanup completion transaction'
          git push origin HEAD:dev/v0.6-full-pipeline
