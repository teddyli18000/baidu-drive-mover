name: v0.2 Bootstrap

on:
  push:
    branches: [dev/v0.2-baidu-readonly]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev/v0.2-baidu-readonly
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: false
      - name: Normalize and validate
        run: |
          go mod tidy
          gofmt -w ./cmd ./internal
          go test ./... -count=1
          go vet ./...
      - name: Commit normalized module/source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum cmd internal
          if git diff --cached --quiet; then
            echo 'Nothing to normalize.'
            exit 0
          fi
          git commit -m 'chore: normalize v0.2 Go dependencies and formatting'
          git push origin HEAD:dev/v0.2-baidu-readonly
