name: Foundation Bootstrap

on:
  push:
    branches: [dev/v0.1-foundation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.1-foundation
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Normalize module and source files
        run: |
          go mod tidy
          gofmt -w ./cmd ./internal
      - name: Commit generated lockfile and formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum cmd internal
          if git diff --cached --quiet; then
            echo 'Nothing to bootstrap.'
            exit 0
          fi
          git commit -m 'chore: normalize Go module and formatting'
          git push origin HEAD:dev/v0.1-foundation
