name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build and test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
      - name: Download locked modules
        run: go mod download
      - name: Verify module files are tidy
        shell: pwsh
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Build Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          go build -trimpath -ldflags "-s -w -X github.com/teddyli18000/baidu-drive-mover/internal/version.Commit=$env:GITHUB_SHA -X github.com/teddyli18000/baidu-drive-mover/internal/version.BuildDate=$date" -o bin/BaiduDriveMover.exe ./cmd/baidu-drive-mover

  linux-race:
    name: Linux formatting, race and logic tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
      - name: Download locked modules
        run: go mod download
      - name: Check formatting
        run: |
          bad=$(gofmt -l ./cmd ./internal)
          if [ -n "$bad" ]; then
            echo "gofmt required:"
            echo "$bad"
            exit 1
          fi
      - name: Test with race detector
        run: go test -race ./... -count=1
