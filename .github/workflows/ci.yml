name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows build and test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache: true
      - name: Download locked modules
        run: go mod download
      - name: Verify module files are tidy
        shell: pwsh
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -skip '^TestProlongedMigrationPersistsAcrossSQLiteRestarts$' -count=1
      - name: Build and verify Windows release package
        shell: pwsh
        run: |
          $date = (git show -s --format=%cI $env:GITHUB_SHA).Trim()
          ./scripts/build-release.ps1 -Version '0.8.0-dev' -Commit $env:GITHUB_SHA -BuildDate $date -OutputRoot 'build/ci-release'
          ./scripts/verify-release.ps1 `
            -ZipPath 'build/ci-release/BaiduDriveMover-0.8.0-dev-windows-amd64.zip' `
            -ChecksumsPath 'build/ci-release/SHA256SUMS.txt' `
            -ExpectedVersion '0.8.0-dev' `
            -ExpectedCommit $env:GITHUB_SHA `
            -WorkRoot (Join-Path $env:RUNNER_TEMP 'bdm-package-smoke')

  linux-race:
    name: Linux formatting, race and logic tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache: true
      - name: Download locked modules
        run: go mod download
      - name: Check formatting
        run: |
          bad=$(gofmt -l ./cmd ./internal)
          if [ -n "$bad" ]; then
            echo "gofmt required:"
            echo "$bad"
            gofmt -d ./cmd ./internal
            exit 1
          fi
      - name: Run prolonged SQLite restart gate without race instrumentation
        run: go test ./internal/app -run '^TestProlongedMigrationPersistsAcrossSQLiteRestarts$' -count=1 -timeout=15m
      - name: Test with race detector
        run: go test -race ./... -count=1
